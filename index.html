<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KY活動表かんたん入力</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;margin:0;background:#f2f2f2;color:#111}
.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px #bbb}
h1{font-size:20px;margin:4px 0 12px}label{font-weight:700;display:block;margin:12px 0 5px}
input,textarea,select{box-sizing:border-box;width:100%;font-size:18px;padding:10px;border:1px solid #999;border-radius:8px}textarea{min-height:76px}
button{width:100%;font-size:19px;font-weight:700;padding:14px;border:0;border-radius:10px;margin-top:12px;background:#111;color:#fff}
.sheet{background:#fff;border:2px solid #111;padding:10px}.head{text-align:center;font-weight:700;font-size:20px;padding:6px 0 10px;line-height:1.25}
.head small{display:block;font-size:10px;font-weight:500;margin-top:3px;text-align:right;padding-right:4px}
.row{display:grid;grid-template-columns:105px 1fr;border-top:1px solid #111;border-left:1px solid #111;border-right:1px solid #111}.row:last-child{border-bottom:1px solid #111}
.lab{border-right:1px solid #111;padding:9px 5px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center}
.val{padding:9px;white-space:pre-wrap;min-height:22px;font-size:14px}.tall .val{min-height:70px}.fixed{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.note{font-size:12px;color:#555;margin-top:8px}
#saveLink{display:none;text-align:center;margin-top:12px;padding:14px;border-radius:10px;background:#222;color:white;text-decoration:none;font-weight:700;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>KY活動表 かんたん入力</h1>
<label>お客様名</label><input id="customer">
<label>作業日</label><input id="date" type="date">
<label>作業内容</label><textarea id="work"></textarea>
<label>危険のポイント</label><textarea id="hazard"></textarea>
<label>私達はこうする</label><textarea id="counter"></textarea>
<label>チーム行動目標</label><textarea id="goal"></textarea>
<label>朝礼時の体調</label><input id="condition" placeholder="例：良好">
<label>グラインダー作業</label><select id="grinder"><option>無</option><option>有</option></select>
<label>作業人数</label><input id="people" inputmode="numeric" placeholder="例：3">
<button onclick="make()">KY表を作る</button>
</div>

<div class="card">
<div class="sheet" id="sheet">
<div class="head">危険予知活動表（作業前報告）<small>東京セキスイファミエス㈱</small></div>
<div class="row"><div class="lab">お客様名</div><div class="val" id="o_customer"></div></div>
<div class="row"><div class="lab">作業日</div><div class="val" id="o_date"></div></div>
<div class="row"><div class="lab">作業内容</div><div class="val" id="o_work"></div></div>
<div class="row tall"><div class="lab">危険のポイント</div><div class="val" id="o_hazard"></div></div>
<div class="row tall"><div class="lab">私達はこうする</div><div class="val" id="o_counter"></div></div>
<div class="row"><div class="lab">チーム行動目標</div><div class="val" id="o_goal"></div></div>
<div class="row"><div class="lab">朝礼時の体調</div><div class="val" id="o_condition"></div></div>
<div class="row"><div class="lab">グラインダー作業</div><div class="val" id="o_grinder">無</div></div>
<div class="row"><div class="lab">会社名・作業人数</div><div class="val fixed"><span>㈱アウターワークス</span><span>作業人数：<b id="o_people"></b> 名</span></div></div>
</div>
<button onclick="saveImage()">KY表を画像にする</button>
<a id="saveLink">画像を保存</a>
<div class="note">「KY表を画像にする」→「画像を保存」の順に押してください。Kizukuでは保存した画像を写真として選べます。</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
function v(id){return document.getElementById(id).value.trim()}
function make(){
 ['customer','work','hazard','counter','goal','condition'].forEach(x=>document.getElementById('o_'+x).textContent=v(x));
 let d=v('date'); if(d){let p=d.split('-');d=p[0]+'年'+Number(p[1])+'月'+Number(p[2])+'日'}
 document.getElementById('o_date').textContent=d;
 document.getElementById('o_grinder').textContent=v('grinder');
 document.getElementById('o_people').textContent=v('people');
 document.getElementById('sheet').scrollIntoView({behavior:'smooth'});
}
async function saveImage(){
 make();
 const canvas=await html2canvas(document.getElementById('sheet'),{scale:2,backgroundColor:'#ffffff'});
 const link=document.getElementById('saveLink');
 link.href=canvas.toDataURL('image/png');
 link.download='KY_'+(v('date')||'today')+'.png';
 link.style.display='block';
 link.scrollIntoView({behavior:'smooth'});
}
let now=new Date(),z=n=>String(n).padStart(2,'0');
document.getElementById('date').value=now.getFullYear()+'-'+z(now.getMonth()+1)+'-'+z(now.getDate());
make();
</script>
</body></html>
